# Render.com Infrastructure-as-Code Blueprint Configuration
# SRM Mobaile Fixit - Full-Stack Mobile Repairing & Training Management System

services:
  - type: web
    name: srm-mobaile-fixit
    env: node
    region: singapore # or oregon / frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/repair/public-stats
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: mobile_repair_system
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL
        value: "true"
