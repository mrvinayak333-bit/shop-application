# Render.com Infrastructure-as-Code Blueprint Configuration
# SRM Mobaile Fixit - Full-Stack Mobile Repairing & Training Management System

services:
  # 1. Backend Express Web Service (Already Deployed)
  - type: web
    name: srm-mobaile-fixit
    env: node
    region: singapore # or oregon / frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/repair/public-stats
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: mobile_repair_system
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL
        value: "true"

  # 2. Frontend React / Vite PWA Static Site
  - type: static
    name: srm-mobaile-fixit-frontend
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    publishDir: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://srm-mobaile-fixit.onrender.com/api
